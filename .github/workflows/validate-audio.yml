name: Validate audio GitOps configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/audio-python"
          "$RUNNER_TEMP/audio-python/bin/python" -m pip install PyYAML==6.0.3
          echo "$RUNNER_TEMP/audio-python/bin" >> "$GITHUB_PATH"
      - name: Check auth and publisher behavior
        run: |
          python3 tests/audio-render-test.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check numeric Flux substitution
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/flux.tar.gz" https://github.com/fluxcd/flux2/releases/download/v2.9.6/flux_2.9.6_linux_amd64.tar.gz
          echo 'b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5  '"$RUNNER_TEMP/flux.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/flux.tar.gz" -C "$RUNNER_TEMP" flux
          FLUX_BIN="$RUNNER_TEMP/flux" python3 tests/audio-flux-substitution-test.py

  flux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/audio-python"
          "$RUNNER_TEMP/audio-python/bin/python" -m pip install PyYAML==6.0.3
          echo "$RUNNER_TEMP/audio-python/bin" >> "$GITHUB_PATH"
      - name: Set isolated kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/audio-gitops-kubeconfig" >> "$GITHUB_ENV"
      - name: Create Kubernetes 1.34 test cluster
        uses: helm/kind-action@v1.12.0
        with:
          kubeconfig: ${{ runner.temp }}/audio-gitops-kubeconfig
          version: v0.33.0
          kubectl_version: v1.34.10
          cluster_name: audio-gitops
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          wait: 180s
      - name: Exercise scoped Flux reconciliation
        run: bash tests/flux-integration.sh
