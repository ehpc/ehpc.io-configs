apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio
  namespace: default
  annotations:
    audio.ehpc.io/release-sha: "5ddf72208d5a660189eca9365ad73249fa42bc9c"
    audio.ehpc.io/release-digest: sha256:9f33a58a7840712ce0eb559c8529b6e48cb400096d34f5f67c11ab63f5a74346
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio
  # Recreate, not RollingUpdate: the single replica owns a ReadWriteOnce volume and
  # opens a SQLite db on it, so surging a second pod would give two writers the same
  # file. Draining can take up to the configured five-minute grace period.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: audio
    spec:
      terminationGracePeriodSeconds: 300
      # The image runs as uid/gid 1000 (app); fsGroup makes the mounted volume
      # group-writable by it.
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - ${AUDIO_MAIL_GID}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audio-data
        # Mount the directory, not the socket inode, so socket restarts remain visible.
        - name: audio-mail
          hostPath:
            path: /run/audio-mail
            type: Directory
      containers:
        - name: audio
          image: ghcr.io/ehpc/ehpc.io-audio@sha256:9f33a58a7840712ce0eb559c8529b6e48cb400096d34f5f67c11ab63f5a74346
          imagePullPolicy: Always
          env:
            - name: MODAL_APP_NAME
              value: audio-inference-v3
            - name: AUTH_ORIGIN
              value: https://audio.ehpc.io
            - name: AUTH_ADMIN_EMAIL
              value: ehpc@ehpc.io
            - name: AUTH_SMTP_SOCKET
              value: /run/audio-mail/submit.sock
            # Valid only while gateway-only ingress is enforced and this node
            # retains its verified gateway pod subnet; recheck before rollout.
            - name: AUTH_TRUSTED_PROXY_CIDRS
              value: "10.42.0.0/24"
            - name: AUTH_OTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: audio-auth
                  key: AUTH_OTP_SECRET
            - name: AUTH_INVITE_SECRET
              valueFrom:
                secretKeyRef:
                  name: audio-auth
                  key: AUTH_INVITE_SECRET
            - name: MODAL_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: audio-modal-token
                  key: token-id
            - name: MODAL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: audio-modal-token
                  key: token-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: audio-openrouter
                  key: OPENROUTER_API_KEY
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: audio-mail
              mountPath: /run/audio-mail
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["python", "-m", "backend.drain"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
