apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audio
  namespace: flux-system
spec:
  interval: 1m
  timeout: 15m
  wait: true
  path: ./gitops/audio
  prune: false
  serviceAccountName: audio-reconciler
  sourceRef:
    kind: GitRepository
    name: audio-config
  postBuild:
    substituteStrategy: Always
    substituteFrom:
      - kind: ConfigMap
        name: audio-runtime
