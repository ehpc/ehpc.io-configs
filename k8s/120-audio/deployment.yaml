apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio
  namespace: default
  annotations:
    audio.ehpc.io/release-sha: 3b78cc1d02321d87e45964956194c4a3566869f5
    audio.ehpc.io/release-digest: sha256:b3975c7f740224d1b8180c98577aab5e54308ae1d39720aac44848e3b533af0d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio
  # Recreate, not RollingUpdate: the single replica owns a ReadWriteOnce volume and
  # opens a SQLite db on it, so surging a second pod would give two writers the same
  # file. Costs a few seconds of downtime per rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: audio
    spec:
      terminationGracePeriodSeconds: 300
      # The image runs as uid/gid 1000 (app); fsGroup makes the mounted volume
      # group-writable by it.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audio-data
      containers:
        - name: audio
          image: ghcr.io/ehpc/ehpc.io-audio@sha256:b3975c7f740224d1b8180c98577aab5e54308ae1d39720aac44848e3b533af0d
          imagePullPolicy: Always
          env:
            - name: MODAL_APP_NAME
              value: audio-inference-v3
            - name: MODAL_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: audio-modal-token
                  key: token-id
            - name: MODAL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: audio-modal-token
                  key: token-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: audio-openrouter
                  key: OPENROUTER_API_KEY
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
